<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Poster Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; }
  .display { font-family: 'Bricolage Grotesque', 'DM Sans', system-ui, sans-serif; }
  .seg button { transition: background .15s, color .15s, box-shadow .15s; }
  .seg button[aria-pressed="true"] { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .seg button:focus-visible, .dz:focus-visible, #dl:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid #2f5bea; outline-offset: 2px; }
  .dz.over { border-color: #2f5bea; background: #eef2ff; }
  #poster { position: relative; overflow: hidden; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
  #poster .t { font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; letter-spacing: -0.03em; line-height: 1.02; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="bg-[#efeeea] text-neutral-900 min-h-screen">
<div class="lg:flex lg:h-screen">

  <!-- Controls -->
  <aside class="bg-white lg:w-[420px] lg:shrink-0 lg:overflow-y-auto p-6 sm:p-8 space-y-7 border-b lg:border-b-0 lg:border-r border-neutral-200">
    <header>
      <h1 class="display text-2xl font-extrabold tracking-tight">fucksynth's album studio</h1>
      <p class="text-sm text-neutral-500 mt-1">add your cover and tracklist, then download a poster.</p>
    </header>

    <div class="space-y-4">
      <label class="block">
        <span class="text-sm font-medium">artist name</span>
        <input id="artist" class="mt-1.5 w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-sm" value="">
      </label>
      <label class="block">
        <span class="text-sm font-medium">album name</span>
        <input id="album" class="mt-1.5 w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-sm" value="">
      </label>
      <label class="block">
        <span class="text-sm font-medium">release year</span>
        <input id="year" inputmode="numeric" maxlength="4" class="mt-1.5 w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-sm" value="">
      </label>
      <label class="block">
        <span class="text-sm font-medium">tracklist <span class="font-normal text-neutral-500">(one track per line)</span></span>
        <textarea id="tracks" rows="8" class="mt-1.5 w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-sm leading-relaxed"></textarea>
      </label>
    </div>

    <div>
      <span class="text-sm font-medium">album cover</span>
      <div id="dz" tabindex="0" role="button" aria-label="choose or drop an album cover image" class="dz mt-1.5 flex items-center gap-4 rounded-xl border-2 border-dashed border-neutral-300 p-3 cursor-pointer hover:border-neutral-400 transition-colors">
        <img id="thumb" alt="" class="w-16 h-16 rounded-lg object-cover bg-neutral-100">
        <div class="text-sm">
          <p class="font-medium">drop an image or click to browse</p>
          <p class="text-neutral-500">JPG, PNG or WebP</p>
        </div>
        <input id="file" type="file" accept="image/*" class="hidden">
      </div>
    </div>

    <div>
      <span class="text-sm font-medium">format</span>
      <div id="seg-format" class="seg mt-1.5 grid grid-cols-3 gap-1 rounded-xl bg-neutral-100 p-1 text-sm"></div>
    </div>

    <div>
      <span class="text-sm font-medium">background</span>
      <div id="seg-bg" class="seg mt-1.5 grid grid-cols-3 gap-1 rounded-xl bg-neutral-100 p-1 text-sm"></div>
      <div id="mono-wrap" class="hidden mt-3">
        <div id="seg-mono" class="seg grid grid-cols-2 gap-1 rounded-xl bg-neutral-100 p-1 text-sm"></div>
      </div>
    </div>

    <button id="dl" class="w-full rounded-xl bg-neutral-900 text-white py-3.5 text-sm font-semibold hover:bg-black transition-colors disabled:opacity-60">download .png</button>
    <p id="msg" class="text-sm text-red-600 min-h-[1.25rem]" role="status"></p>
  </aside>

  <!-- Preview -->
  <main id="stage" class="flex-1 min-h-[70vh] lg:min-h-0 flex items-center justify-center p-5 sm:p-10 overflow-hidden">
    <div id="frame" class="relative shadow-[0_24px_60px_-20px_rgba(0,0,0,.35)]">
      <div id="scaler" style="transform-origin: top left; position:absolute; left:0; top:0;">
        <div id="poster"></div>
      </div>
    </div>
  </main>
</div>

<script>
const FORMATS = {
  square:   { label: 'square',   sub: '1:1',  w: 1080, h: 1080 },
  portrait: { label: 'poster',   sub: '4:5',  w: 1080, h: 1350 },
  story:    { label: 'story',    sub: '9:16', w: 1080, h: 1920 }
};
const S = { format: 'portrait', bg: 'gradient', mono: 'black', img: null, colors: [[40,60,90],[200,120,90],[20,30,50]] };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const lum = c => (0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]) / 255;

/* ---------- segmented controls ---------- */
function seg(id, key, opts) {
  const el = $(id);
  el.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" class="rounded-lg py-2 px-1 text-neutral-600 font-medium">${l}</button>`).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S[key] = b.dataset.v; sync(); render();
  });
}
function sync() {
  [['seg-format','format'],['seg-bg','bg'],['seg-mono','mono']].forEach(([id,k]) =>
    $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[k])));
  $('mono-wrap').classList.toggle('hidden', S.bg !== 'mono');
}
seg('seg-format', 'format', Object.entries(FORMATS).map(([k, f]) => [k, `${f.label} <span class="opacity-60">${f.sub}</span>`]));
seg('seg-bg', 'bg', [['dominant','dominant'],['gradient','gradient'],['mono','minimal']]);
seg('seg-mono', 'mono', [['black','black'],['white','white']]);

/* ---------- color extraction (canvas getImageData) ---------- */
function extractColors(img) {
  const N = 56, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, N, N);
  const d = x.getImageData(0, 0, N, N).data, buckets = {};
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] < 128) continue;
    const r = d[i], g = d[i+1], b = d[i+2], k = (r>>4)<<8 | (g>>4)<<4 | (b>>4);
    const B = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0 });
    B.n++; B.r += r; B.g += g; B.b += b;
  }
  const list = Object.values(buckets).map(B => {
    const col = [B.r/B.n, B.g/B.n, B.b/B.n].map(Math.round);
    const mx = Math.max(...col), mn = Math.min(...col), sat = mx ? (mx-mn)/mx : 0, l = lum(col);
    let score = B.n * (0.35 + sat);
    if (l < 0.07 || l > 0.94) score *= 0.25;
    return { col, score };
  }).sort((a, b) => b.score - a.score);
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
  const out = [];
  for (const it of list) { if (out.every(o => dist(o, it.col) > 90)) out.push(it.col); if (out.length === 3) break; }
  const base = out[0] || [60,60,60];
  while (out.length < 3) out.push(out.length === 1 ? base.map(v => Math.min(255, v + 60)) : base.map(v => Math.round(v * 0.55)));
  return out;
}

/* soft blurred backdrop: gradient + heavily upscaled thumbnail (html2canvas can't do CSS blur) */
function makeBackdrop(img, cols) {
  const W = 270, H = 480, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0, rgb(cols[1])); g.addColorStop(0.5, rgb(cols[0])); g.addColorStop(1, rgb(cols[2]));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const t = document.createElement('canvas'); t.width = t.height = 10;
  t.getContext('2d').drawImage(img, 0, 0, 10, 10);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.globalAlpha = 0.5; x.drawImage(t, -H*0.2, 0, H*1.4, H);
  return c.toDataURL('image/jpeg', 0.92);
}

/* ---------- poster render ---------- */
function render() {
  const f = FORMATS[S.format], p = $('poster');
  const artist = esc($('artist').value.trim() || 'Artist Name');
  const album  = esc($('album').value.trim()  || 'Album Title');
  const year   = esc($('year').value.trim());
  const tracks = $('tracks').value.split('\n').map(t => t.trim()).filter(Boolean);
  const n = tracks.length;

  let bgCss, avg;
  if (S.bg === 'dominant') { bgCss = `background:${rgb(S.colors[0])}`; avg = S.colors[0]; }
  else if (S.bg === 'gradient') {
    const url = S.img ? makeBackdrop(S.img, S.colors) : '';
    bgCss = `background:${rgb(S.colors[0])} url(${url}) center/cover no-repeat`;
    avg = S.colors[0].map((v, i) => (v + S.colors[1][i] + S.colors[2][i]) / 3);
  } else { avg = S.mono === 'black' ? [0,0,0] : [255,255,255]; bgCss = `background:${rgb(avg)}`; }
  const dark = lum(avg) < 0.55, ink = dark ? '#ffffff' : '#0a0a0a', soft = dark ? 'rgba(255,255,255,.62)' : 'rgba(0,0,0,.55)';
  const cover = S.img ? `background:url(${S.img.src}) center/cover` : 'background:#888';
  const coverBox = size => `<div style="width:${size}px;height:${size}px;flex:none;border-radius:6px;${cover};box-shadow:0 30px 60px -20px rgba(0,0,0,${dark ? .55 : .3})"></div>`;

  const long = album.length > 24 ? 0.78 : album.length > 16 ? 0.9 : 1;
  const head = (size, gap) => `
    <div style="margin-top:${gap}px">
      <div class="t" style="font-size:${Math.round(size*long)}px;overflow-wrap:anywhere">${album}</div>
      <div style="margin-top:${Math.round(size*0.28)}px;font-size:${Math.round(size*0.4)}px;font-weight:500;color:${soft}">${artist}${year ? ' &nbsp;/&nbsp; ' + year : ''}</div>
    </div>`;
  const list = (cols, availH, max, gapX) => {
    const rows = Math.ceil(n / cols) || 1;
    const fs = Math.max(13, Math.min(max, Math.floor(availH / (rows * 1.7))));
    return `<ol style="list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(${rows},auto);grid-template-columns:repeat(${cols},1fr);column-gap:${gapX}px;row-gap:${Math.round(fs*0.45)}px;font-size:${fs}px;line-height:1.25;color:${ink}">
      ${tracks.map((t, i) => `<li style="display:flex;gap:${Math.round(fs*0.8)}px"><span style="width:${Math.round(fs*1.5)}px;flex:none;color:${soft};font-variant-numeric:tabular-nums">${String(i+1).padStart(2,'0')}</span><span>${esc(t)}</span></li>`).join('')}</ol>`;
  };

  let inner, pad = 96;
  if (S.format === 'square') {
    pad = 84;
    inner = `<div style="display:flex;gap:64px;height:100%">
      ${coverBox(420)}
      <div style="display:flex;flex-direction:column;justify-content:space-between;min-width:0;flex:1">
        ${head(56, 0)}
        ${list(1, 500, 24, 0)}
      </div></div>`;
  } else if (S.format === 'portrait') {
    inner = `<div style="display:flex;flex-direction:column;height:100%">
      ${coverBox(600)}
      ${head(68, 52)}
      <div style="margin-top:auto">${list(2, 300, 24, 56)}</div></div>`;
  } else {
    inner = `<div style="display:flex;flex-direction:column;height:100%">
      ${coverBox(888)}
      ${head(80, 60)}
      <div style="margin-top:auto">${list(1, 500, 30, 0)}</div></div>`;
  }

  p.style.cssText = `width:${f.w}px;height:${f.h}px;padding:${pad}px;color:${ink};${bgCss}`;
  p.innerHTML = inner;
  fit();
}

/* ---------- responsive preview scaling ---------- */
function fit() {
  const f = FORMATS[S.format], st = $('stage'), cs = getComputedStyle(st);
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = window.innerWidth >= 1024 ? st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) : Infinity;
  const s = Math.min(aw / f.w, ah / f.h, 1);
  $('scaler').style.transform = `scale(${s})`;
  $('frame').style.width = f.w * s + 'px'; $('frame').style.height = f.h * s + 'px';
}
new ResizeObserver(fit).observe($('stage'));

/* ---------- image handling ---------- */
function setImage(src) {
  const img = new Image();
  img.onload = () => {
    S.img = img; S.colors = extractColors(img);
    $('thumb').src = src; $('msg').textContent = ''; render();
  };
  img.onerror = () => { $('msg').textContent = "that file couldnt be read as an image. try jpg png or webp."; };
  img.src = src;
}
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) { $('msg').textContent = 'Choose an image file (jpg, png or webp).'; return; }
  const r = new FileReader(); r.onload = () => setImage(r.result); r.readAsDataURL(file);
}
const dz = $('dz');
dz.addEventListener('click', () => $('file').click());
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

/* default cover so the preview is alive on first load */
function defaultCover() {
  const c = document.createElement('canvas'); c.width = c.height = 800; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 800, 800); g.addColorStop(0, '#0f3d4a'); g.addColorStop(1, '#0a1f2c');
  x.fillStyle = g; x.fillRect(0, 0, 800, 800);
  const s = x.createRadialGradient(400, 470, 20, 400, 470, 300); s.addColorStop(0, '#ffd9a0'); s.addColorStop(0.45, '#ff7a59'); s.addColorStop(1, 'rgba(255,122,89,0)');
  x.fillStyle = s; x.fillRect(0, 0, 800, 800);
  x.fillStyle = '#ffe9c4'; x.beginPath(); x.arc(400, 470, 150, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#0a1f2c'; x.fillRect(0, 560, 800, 240);
  x.fillStyle = 'rgba(255,233,196,.35)';
  for (let i = 0; i < 6; i++) x.fillRect(400 - 130 + i * 12, 575 + i * 26, 260 - i * 24, 7);
  return c.toDataURL('image/png');
}

/* ---------- export ---------- */
$('dl').addEventListener('click', async () => {
  const btn = $('dl'), f = FORMATS[S.format];
  if (typeof html2canvas === 'undefined') { $('msg').textContent = 'The export library did not load. Check your connection and reload.'; return; }
  btn.disabled = true; btn.textContent = 'Rendering…'; $('msg').textContent = '';
  try {
    await document.fonts.ready;
    const canvas = await html2canvas($('poster'), {
      scale: 2, useCORS: true, backgroundColor: null, logging: false, width: f.w, height: f.h,
      onclone: doc => { const sc = doc.getElementById('scaler'); sc.style.transform = 'none'; }
    });
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const a = document.createElement('a');
    a.download = `${slug($('artist').value) || 'artist'}-${slug($('album').value) || 'album'}-${S.format}.png`;
    a.href = canvas.toDataURL('image/png'); a.click();
  } catch (e) {
    $('msg').textContent = "Export failed. Try a smaller cover image, then download again.";
  } finally { btn.disabled = false; btn.textContent = 'Download PNG'; }
});

/* ---------- wire up ---------- */
['artist','album','year','tracks'].forEach(id => $(id).addEventListener('input', render));
window.addEventListener('resize', fit);
sync(); setImage(defaultCover());
if (document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
